name: Daily job scrape

on:
  schedule:
    # 每天 05:30 HKT(= 21:30 UTC 前一天)跑一次,对应屁宝早上打开网站前
    - cron: "30 21 * * *"
  workflow_dispatch: # 也支持手动触发

permissions:
  contents: write # 需要把更新后的 jobs.json 提交回仓库

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 装带系统依赖的 Chromium(GitHub runner 网络正常,无需 IGNORE_HTTPS)
      - run: npx playwright install --with-deps chromium
      - run: npm run scrape
      - name: Commit refreshed jobs.json
        run: |
          if git diff --quiet -- src/data/jobs.json; then
            echo "No changes in jobs.json — nothing to commit."
          else
            git config user.name "ibd-compass-bot"
            git config user.email "ibd-compass-bot@users.noreply.github.com"
            git add src/data/jobs.json
            git commit -m "chore: daily job scrape $(date -u +%Y-%m-%d)"
            git push origin HEAD:${{ github.ref_name }}
          fi
